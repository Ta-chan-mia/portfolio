     <!--CONTACT-->
 <section id="contact" class="contact-section">
      <h2 class="section-title">CONTACT</h2>
      <form class="contact-form">
        <div class="form-group">
          <label>お名前 <span class="required">必須</span></label>
          <input type="text" placeholder="入力してください" required>
        </div>
        <div class="form-group">
          <label>フリガナ <span class="required">必須</span></label>
          <input type="text" placeholder="入力してください" required>
        </div>
        <div class="form-group">
          <label>メールアドレス <span class="required">必須</span></label>
          <input type="email" placeholder="入力してください" required>
        </div>
        <div class="form-group">
          <label>お問い合わせフォーム内容 <span class="required">必須</span></label>
          <textarea placeholder="入力してください" rows="5" required></textarea>
        </div>
        <button type="submit" class="submit-btn">内容を送信する →</button>
      </form>
    </section>
